<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>




    <!-- Topbar -->
    <div id="topbar">
        <i class="fa-solid fa-circle-user tpr-icn"></i>
        <p id="welcomeOpen">NeuOS</p>
        <p id="time">00:00:00</p>
    </div>







    <!-- Welcome Message App -->
    <div class="win" id="welcome">
        <div class="winHdr" id="welcomeHeader">
            <p style="margin-left: 10px;"><b>Welcome Message</b></p>
            <button class="clsBtn" onclick="closeWin('welcome')" style="margin-right: 10px;"></button>
        </div>
        <h1>Welcome to NeuOS</h1>
        <div id="intro-message">
            <img id="profilepic" src="img/profile.png" alt="Profile Picture" width="150px" onerror="this.style.display='none'">
            <p>Hello! This is NeuOS, a neumorphic web OS that runs in the browser. <br>This architecture relies on localized DOM manipulation and Canvas APIs. <br>System ready.</p>
        </div>
    </div>




    <!-- Notes App -->
    <div class="win" id="nt" style="display: none;">
        <div class="winHdr" id="ntHeader">
            <p style="margin-left: 10px;"><b>Notes Application</b></p>
            <button class="clsBtn" onclick="closeWin('nt')" style="margin-right: 10px;"></button>
        </div>
        <div class="app-tlb">
            <i class="fa-solid fa-note-sticky tlb-icn"></i>
            <p style="flex-grow: 1;">Notes Editor</p>
            <button class="neu-btn" onclick="createNewNote()">New Note</button>
        </div>
        <div class="app-lyt">
            <div id="sidebar" class="neu-ins">
            </div>
            <div id="notesContent" class="neu-ins" contenteditable="true" oninput="saveCurrentNote()">
            </div>
        </div>
    </div>







    <!-- Paint App -->
    <div class="win" id="pnt" style="display: none;">
        <div class="winHdr" id="pntHeader">
            <p style="margin-left: 10px;"><b>Paint Application</b></p>
            <button class="clsBtn" onclick="closeWin('pnt')" style="margin-right: 10px;"></button>
        </div>
        <div class="app-tlb">
            <i class="fa-solid fa-palette tlb-icn"></i>
            <p style="flex-grow: 1;">Canvas Setup</p>
            <input type="color" id="colorPicker" value="#332a3a" class="neu-inp" title="Select Color">
            <input type="range" id="brushSize" min="1" max="20" value="5" class="neu-inp" title="Brush Size">
            <button class="neu-btn" onclick="clearCanvas()">Clear Canvas</button>
        </div>
        <div class="app-lyt">
            <canvas id="pntCnv" class="neu-ins" width="700" height="400"></canvas>
        </div>
    </div>




    <!-- Desktop Icons -->
    <div id="desktopApps" style="padding-top: 100px; padding-left: 20px;">
        <div class="icon" onclick="handleIconTap(this, 'nt')">
            <i class="fa-solid fa-note-sticky icn-grp"></i>
            <p style="margin: 0px;">Notes</p>
        </div>
        <div class="icon" onclick="handleIconTap(this, 'pnt')">
            <i class="fa-solid fa-palette icn-grp"></i>
            <p style="margin: 0px;">Paint</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
