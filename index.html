<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>







    <!-- Topbar -->
    <div id="topbar">
        <i class="fa-solid fa-circle-user topbar-icon"></i>
        <p id="welcomeOpen">NeuOS</p>
        <p id="time">00:00:00</p>
    </div>






    <!-- Welcome Message App -->
    <div class="window" id="welcome">
        <div class="windowHeader" id="welcomeHeader">
            <p>Welcome Message</p>
            <button class="closeButton" onclick="closeWindow('welcome')"></button>
        </div>
        <h1>Welcome to NeuOS</h1>
        <div id="intro-message">
            <img id="profilepic" src="img/profile.png" alt="Profile Picture" width="150px" onerror="this.style.display='none'">
            <p>Hello! This is NeuOS, a neumorphic web OS that runs in the browser. <br>This architecture relies on localized DOM manipulation and Canvas APIs. <br>System ready.</p>
        </div>
    </div>







    <!-- Notes App -->
    <div class="window" id="note" style="display: none;">
        <div class="windowHeader" id="noteHeader">
            <p>Notes Application</p>
            <button class="closeButton" onclick="closeWindow('note')"></button>
        </div>
        <div class="app-toolbar">
            <i class="fa-solid fa-note-sticky toolbar-icon"></i>
            <p style="flex-grow: 1;">Notes Editor</p>
            <button class="neu-button" onclick="createNewNote()">New Note</button>
        </div>
        <div class="app-layout">
            <div id="sidebar" class="neu-inset">
                <!-- Sidebar items injected via JS -->
            </div>
            <div id="notesContent" class="neu-inset" contenteditable="true" oninput="saveCurrentNote()">
                <!-- Note content injected via JS -->
            </div>
        </div>
    </div>









    <!-- Paint App -->
    <div class="window" id="paint" style="display: none;">
        <div class="windowHeader" id="paintHeader">
            <p>Paint Application</p>
            <button class="closeButton" onclick="closeWindow('paint')"></button>
        </div>
        <div class="app-toolbar">
            <i class="fa-solid fa-palette toolbar-icon"></i>
            <p style="flex-grow: 1;">Canvas Setup</p>
            <input type="color" id="colorPicker" value="#332a3a" class="neu-input" title="Select Color">
            <input type="range" id="brushSize" min="1" max="20" value="5" class="neu-input" title="Brush Size">
            <button class="neu-button" onclick="clearCanvas()">Clear Canvas</button>
        </div>
        <div class="app-layout">
            <canvas id="paintCanvas" class="neu-inset" width="700" height="400"></canvas>
        </div>
    </div>





    <!-- Desktop Icons -->
    <div id="desktopApps">
        <div class="icon" onclick="handleIconTap(this, 'note')">
            <i class="fa-solid fa-note-sticky icon-graphic"></i>
            <p>Notes</p>
        </div>
        <div class="icon" onclick="handleIconTap(this, 'paint')">
            <i class="fa-solid fa-palette icon-graphic"></i>
            <p>Paint</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
